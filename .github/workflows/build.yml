name: Build

# Compile RoboVac Rescue for AmigaOS (m68k) on every push and pull request.
# The build runs inside the community amigadev/crosstools image, which ships
# Bebbo's m68k-amigaos-gcc toolchain and AmigaOS headers, so nothing needs to
# be installed on the runner itself.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:   # lets you run it by hand from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Compile with the Amiga cross-compiler
        run: |
          docker run --rm -v "$PWD":/src -w /src \
            amigadev/crosstools:m68k-amigaos \
            make

      - name: Confirm the binary was produced
        run: |
          ls -la robovac
          file robovac || true

      - name: Upload the compiled binary
        uses: actions/upload-artifact@v4
        with:
          name: robovac
          path: robovac
          if-no-files-found: error
